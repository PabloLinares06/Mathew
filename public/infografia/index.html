<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <title>Embed Figma</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #fff;
        overflow: hidden;
      }

      .wrap {
        max-width: 100%;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      .frame {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: #fff;
        border: 0;
        border-radius: 0;
        overflow: hidden;
      }

      .frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="frame">
        <iframe
          src="https://embed.figma.com/proto/bSf89kYEnmTGjuefZzxpBp/Sal%C3%B3n-Prado..?node-id=24-3&p=f&scaling=min-zoom&content-scaling=fixed&page-id=0%3A1&embed-host=share"
          allowfullscreen
        ></iframe>
      </div>
    </div>
  </body>
</html>
